<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Actividades - MML</title>
    
    <!-- Bootstrap 5 para el diseño responsivo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS (Filtros y Búsqueda) -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">
    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <!-- FontAwesome para Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-mml { background-color: #0d47a1; color: white; }
        .fc-event { cursor: pointer; }
        .spinner-container { display: flex; justify-content: center; align-items: center; height: 50vh; }
        #main-content { display: none; }
        .card { border-radius: 12px; border: none; }
        .nav-pills .nav-link.active { background-color: #0d47a1; }
        .nav-pills .nav-link { color: #0d47a1; font-weight: 500; }
        #actividadesTable tbody tr { cursor: pointer; }
    </style>
</head>
<body>
    <!-- Encabezado -->
    <nav class="navbar navbar-expand-lg navbar-mml shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="#">
                <i class="fa-solid fa-landmark me-2"></i>Agenda Institucional - MML
            </a>
        </div>
    </nav>

    <div class="container">
        <!-- Indicador de Carga -->
        <div id="loading" class="spinner-container">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
                <h5 class="mt-3 text-muted">Cargando datos desde Google Sheets...</h5>
            </div>
        </div>

        <!-- Contenido Principal -->
        <div id="main-content">
            <!-- Pestañas de Navegación -->
            <ul class="nav nav-pills mb-4 justify-content-center shadow-sm p-2 bg-white rounded-pill" id="pills-tab" role="tablist" style="display: inline-flex;">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active rounded-pill px-4" id="pills-calendar-tab" data-bs-toggle="pill" data-bs-target="#pills-calendar" type="button" role="tab">
                        <i class="fa-regular fa-calendar me-2"></i>Calendario
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link rounded-pill px-4" id="pills-table-tab" data-bs-toggle="pill" data-bs-target="#pills-table" type="button" role="tab">
                        <i class="fa-solid fa-list me-2"></i>Búsqueda Avanzada
                    </button>
                </li>
            </ul>

            <div class="tab-content" id="pills-tabContent">
                <!-- Vista de Calendario -->
                <div class="tab-pane fade show active" id="pills-calendar" role="tabpanel">
                    <div class="card shadow-sm p-3">
                        <div class="card-body">
                            <div id="calendar"></div>
                        </div>
                    </div>
                </div>

                <!-- Vista de Tabla -->
                <div class="tab-pane fade" id="pills-table" role="tabpanel">
                    <div class="card shadow-sm p-3">
                        <div class="card-body">
                            <table id="actividadesTable" class="table table-hover dt-responsive nowrap" style="width:100%">
                                <thead class="table-light">
                                    <tr>
                                        <th>Fecha Inicio</th>
                                        <th>Fecha Fin</th>
                                        <th>Actividad</th>
                                        <th>Gerencia</th>
                                        <th>Hora</th>
                                        <th>Lugar</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Detalles del Evento -->
    <div class="modal fade" id="eventModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow">
                <div class="modal-header text-white" style="background-color: #0d47a1;">
                    <h5 class="modal-title fw-bold" id="modalTitle">Detalle de Actividad</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <p class="mb-2"><strong><i class="fa-solid fa-users text-primary me-2"></i>Gerencia:</strong> <span id="modalGerencia"></span></p>
                            <p class="mb-2"><strong><i class="fa-regular fa-calendar-check text-success me-2"></i>Fechas:</strong> <span id="modalFechas"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p class="mb-2"><strong><i class="fa-regular fa-clock text-warning me-2"></i>Hora:</strong> <span id="modalHora"></span></p>
                            <p class="mb-2"><strong><i class="fa-solid fa-location-dot text-danger me-2"></i>Lugar:</strong> <span id="modalLugar"></span></p>
                        </div>
                    </div>
                    <hr>
                    <h6 class="fw-bold">Descripción de la Actividad:</h6>
                    <p id="modalDescripcion" class="text-secondary" style="white-space: pre-wrap;"></p>
                </div>
                <div class="modal-footer bg-light">
                    <!-- Botón para ver en Google Maps -->
                    <a id="btnMaps" href="#" target="_blank" class="btn btn-outline-danger">
                        <i class="fa-solid fa-map-location-dot me-1"></i> Ver en Maps
                    </a>
                    <!-- Botón Compartir en WhatsApp -->
                    <a id="btnWhatsapp" href="#" target="_blank" class="btn btn-success">
                        <i class="fa-brands fa-whatsapp me-1"></i> Compartir
                    </a>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Librerías JS -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    
    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>

    <script>
        // =========================================================================
        // PASO 1: PEGA AQUÍ TU ENLACE CSV DE GOOGLE SHEETS
        // (Asegúrate de publicarlo en la web como CSV)
        // =========================================================================
        const GOOGLE_SHEETS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQLr6db3J4OciGLKsssPs0GFUWXQ-S2i3Yb9krz7IJAI8A5a6500KLPf3E71EXh0AtQx5glqQ1WuD2e/pub?output=csv";
        
        // =========================================================================
        // COLORES POR GERENCIA (Puedes agregar las tuyas)
        // =========================================================================
        const coloresGerencia = {
            "Gerencia de Cultura": "#198754",
            "Gerencia de Seguridad": "#dc3545",
            "Gerencia de Desarrollo Social": "#fd7e14",
            "Alcaldía": "#6f42c1",
            "Default": "#0d6efd" // Color por defecto (Azul institucional)
        };

        // --- Funciones Utilitarias ---
        // Convierte "DD/MM/YYYY" de Excel a "YYYY-MM-DD" para el calendario
        function formatoISO(fechaDDMMYYYY) {
            if (!fechaDDMMYYYY) return null;
            const partes = fechaDDMMYYYY.split('/');
            if (partes.length === 3) {
                return `${partes[2]}-${partes[1]}-${partes[0]}`;
            }
            return fechaDDMMYYYY; 
        }

        // FullCalendar necesita que la "Fecha Fin" sea el día siguiente (exclusivo)
        function sumarUnDia(fechaISO) {
            if (!fechaISO) return null;
            const fecha = new Date(fechaISO);
            fecha.setDate(fecha.getDate() + 1);
            return fecha.toISOString().split('T')[0];
        }

        // Iniciar al cargar la página
        document.addEventListener('DOMContentLoaded', function() {
            Papa.parse(GOOGLE_SHEETS_CSV_URL, {
                download: true,
                header: true,
                complete: function(resultados) {
                    procesarDatos(resultados.data);
                },
                error: function(err) {
                    console.error("Error al leer el archivo:", err);
                    alert("No se pudo cargar la información. Revisa el enlace del CSV.");
                }
            });
        });

        function procesarDatos(filasBrutas) {
            const eventosCalendario = [];
            const filasTabla = [];

            filasBrutas.forEach(fila => {
                // Si la fila no tiene título ni fecha, la ignoramos
                if (!fila['Actividad'] || !fila['Fecha Inicio']) return;

                const titulo = fila['Actividad'].trim();
                const fechaInicioTexto = fila['Fecha Inicio'].trim();
                const fechaFinTexto = fila['Fecha Fin'] ? fila['Fecha Fin'].trim() : '';
                const gerencia = fila['Gerencia'] ? fila['Gerencia'].trim() : 'General';
                const hora = fila['Hora'] ? fila['Hora'].trim() : 'Hora por definir';
                const lugar = fila['Lugar'] ? fila['Lugar'].trim() : 'Lugar por definir';
                const descripcion = fila['Descripción'] ? fila['Descripción'].trim() : 'Sin descripción adicional.';

                const fechaInicioISO = formatoISO(fechaInicioTexto);
                let fechaFinISO = formatoISO(fechaFinTexto);
                
                if (fechaFinISO) {
                    fechaFinISO = sumarUnDia(fechaFinISO);
                }

                const colorFondo = coloresGerencia[gerencia] || coloresGerencia["Default"];
                const fechaParaMostrar = fechaFinTexto ? `${fechaInicioTexto} al ${fechaFinTexto}` : fechaInicioTexto;

                // 1. Guardar para el Calendario
                eventosCalendario.push({
                    title: titulo,
                    start: fechaInicioISO,
                    end: fechaFinISO,
                    backgroundColor: colorFondo,
                    borderColor: colorFondo,
                    extendedProps: {
                        gerencia: gerencia,
                        hora: hora,
                        lugar: lugar,
                        descripcion: descripcion,
                        fechaMostrar: fechaParaMostrar
                    }
                });

                // 2. Guardar para la Tabla
                filasTabla.push([
                    fechaInicioTexto,
                    fechaFinTexto,
                    titulo,
                    gerencia,
                    hora,
                    lugar,
                    descripcion
                ]);
            });

            iniciarCalendario(eventosCalendario);
            iniciarTabla(filasTabla);

            // Ocultar animación de carga y mostrar el portal
            document.getElementById('loading').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';

            // Ajustar el tamaño del calendario y tabla al cambiar de pestaña
            $('button[data-bs-toggle="pill"]').on('shown.bs.tab', function () {
                window.dispatchEvent(new Event('resize'));
            });
        }

        function iniciarCalendario(eventos) {
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'es',
                height: 650,
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,listMonth'
                },
                buttonText: { today: 'Hoy', month: 'Mes', list: 'Lista' },
                events: eventos,
                eventClick: function(info) {
                    abrirDetalles(info.event.title, info.event.extendedProps);
                }
            });
            calendar.render();
        }

        function iniciarTabla(datosFilas) {
            const table = $('#actividadesTable').DataTable({
                data: datosFilas,
                responsive: true,
                language: {
                    url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json'
                },
                // Ocultamos la columna 6 (Descripción) en la tabla para no sobrecargarla, pero sigue siendo buscable
                columnDefs: [ { targets: 6, visible: false } ],
                order: [[0, "desc"]]
            });

            // Hacer clic en la fila abre los detalles
            $('#actividadesTable tbody').on('click', 'tr', function () {
                const dataFila = table.row(this).data();
                if(!dataFila) return;
                
                const props = {
                    fechaMostrar: dataFila[1] ? `${dataFila[0]} al ${dataFila[1]}` : dataFila[0],
                    gerencia: dataFila[3],
                    hora: dataFila[4],
                    lugar: dataFila[5],
                    descripcion: dataFila[6]
                };
                abrirDetalles(dataFila[2], props);
            });
        }

        function abrirDetalles(titulo, detalles) {
            document.getElementById('modalTitle').textContent = titulo;
            document.getElementById('modalGerencia').textContent = detalles.gerencia;
            document.getElementById('modalFechas').textContent = detalles.fechaMostrar;
            document.getElementById('modalHora').textContent = detalles.hora;
            document.getElementById('modalLugar').textContent = detalles.lugar;
            document.getElementById('modalDescripcion').textContent = detalles.descripcion;

            // Funcionalidad extra: Maps y WhatsApp
            const textoMaps = encodeURIComponent(detalles.lugar + ", Lima");
            document.getElementById('btnMaps').href = `https://www.google.com/maps/search/?api=1&query=${textoMaps}`;

            const mensajeWA = `*${titulo}*\n📅 Fecha: ${detalles.fechaMostrar}\n⏰ Hora: ${detalles.hora}\n📍 Lugar: ${detalles.lugar}\n🏢 Organiza: ${detalles.gerencia}`;
            document.getElementById('btnWhatsapp').href = `https://wa.me/?text=${encodeURIComponent(mensajeWA)}`;

            const modal = new bootstrap.Modal(document.getElementById('eventModal'));
            modal.show();
        }
    </script>
</body>
</html>
