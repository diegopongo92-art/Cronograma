<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Actividades - MML</title>
    
    <!-- Fuentes Minimalistas (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { 
            background-color: #fcfcfc; 
            font-family: 'Inter', sans-serif; 
            color: #333;
        }
        
        /* Cabecera minimalista */
        .navbar-mml { 
            background-color: #ffffff; 
            border-bottom: 1px solid #eaeaea;
        }
        .navbar-brand { color: #111 !important; letter-spacing: -0.5px; }
        
        /* Pestañas minimalistas */
        .nav-tabs { border-bottom: 2px solid #eaeaea; }
        .nav-tabs .nav-link { 
            border: none; 
            color: #666; 
            font-weight: 500;
            padding: 1rem 2rem;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .nav-tabs .nav-link:hover { border-color: transparent; color: #111; }
        .nav-tabs .nav-link.active { 
            background: transparent; 
            border-color: transparent; 
            border-bottom: 2px solid #111; 
            color: #111; 
        }

        /* FullCalendar Estilos */
        .fc-theme-standard th { border-color: #f0f0f0; font-weight: 500; color: #555; padding: 10px 0; }
        .fc-theme-standard td, .fc-theme-standard th { border-color: #f0f0f0; }
        .fc-event { border-radius: 4px; border: none; padding: 2px 4px; font-size: 0.85em; font-weight: 500; cursor: pointer; }
        
        /* Tabla */
        .table { border-color: #f0f0f0; }
        .table th { background-color: #fff; font-weight: 600; color: #444; border-bottom: 2px solid #eaeaea; }
        .table td { vertical-align: middle; }
        #actividadesTable tbody tr { cursor: pointer; transition: background-color 0.2s; }
        #actividadesTable tbody tr:hover { background-color: #f8f9fa; }
        
        /* Botones e Inputs */
        .form-control, .form-select { border-radius: 8px; border-color: #ddd; box-shadow: none !important; }
        .form-control:focus, .form-select:focus { border-color: #111; }
        .badge-gerencia { padding: 6px 10px; font-weight: 500; border-radius: 6px; font-size: 0.8em; }

        .spinner-container { display: flex; justify-content: center; align-items: center; height: 60vh; }
        #main-content { display: none; }
        
        /* Modal */
        .modal-content { border-radius: 16px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .modal-header { border-bottom: 1px solid #eaeaea; background-color: #fff; color: #111; border-radius: 16px 16px 0 0; }
        .modal-footer { border-top: 1px solid #eaeaea; background-color: #fff; border-radius: 0 0 16px 16px; }
        .btn-custom { border-radius: 8px; font-weight: 500; }
    </style>
</head>
<body>

    <!-- Encabezado -->
    <nav class="navbar navbar-expand-lg navbar-mml py-3 mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold fs-4" href="#">
                <i class="fa-solid fa-layer-group me-2" style="color: #111;"></i>Agenda MML
            </a>
        </div>
    </nav>

    <div class="container-fluid px-4 mb-5">
        
        <!-- Indicador de Carga -->
        <div id="loading" class="spinner-container">
            <div class="text-center">
                <div class="spinner-border text-dark" role="status" style="width: 2.5rem; height: 2.5rem;"></div>
                <h6 class="mt-3 text-muted fw-normal">Sincronizando datos...</h6>
            </div>
        </div>

        <!-- Contenido Principal -->
        <div id="main-content">
            
            <!-- Pestañas -->
            <ul class="nav nav-tabs mb-4" id="view-tabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="tab-calendar" data-bs-toggle="tab" data-bs-target="#view-calendar" type="button" role="tab">
                        <i class="fa-regular fa-calendar me-2"></i>Vista Calendario
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="tab-table" data-bs-toggle="tab" data-bs-target="#view-table" type="button" role="tab">
                        <i class="fa-solid fa-bars-staggered me-2"></i>Búsqueda Avanzada
                    </button>
                </li>
            </ul>

            <div class="tab-content" id="view-tabsContent">
                
                <!-- VISTA 1: CALENDARIO -->
                <div class="tab-pane fade show active" id="view-calendar" role="tabpanel">
                    <div class="bg-white p-4 rounded-4 border" style="border-color: #eaeaea !important;">
                        <div id="calendar" style="min-height: 75vh;"></div>
                    </div>
                </div>

                <!-- VISTA 2: TABLA CON FILTROS -->
                <div class="tab-pane fade" id="view-table" role="tabpanel">
                    <div class="bg-white p-4 rounded-4 border" style="border-color: #eaeaea !important;">
                        
                        <!-- Filtros Avanzados -->
                        <div class="row mb-4 bg-light p-3 rounded-3">
                            <div class="col-md-4 mb-2 mb-md-0">
                                <label class="form-label text-muted small fw-bold mb-1">Filtrar por Gerencia</label>
                                <select id="filterGerencia" class="form-select">
                                    <option value="">Todas las gerencias</option>
                                </select>
                            </div>
                            <div class="col-md-3 mb-2 mb-md-0">
                                <label class="form-label text-muted small fw-bold mb-1">Buscar por Fecha Exacta</label>
                                <input type="date" id="filterFecha" class="form-control">
                            </div>
                            <div class="col-md-5 d-flex align-items-end justify-content-end">
                                <button id="btnClearFilters" class="btn btn-outline-secondary btn-custom">
                                    <i class="fa-solid fa-eraser me-1"></i> Limpiar Filtros
                                </button>
                            </div>
                        </div>

                        <table id="actividadesTable" class="table dt-responsive nowrap w-100">
                            <thead>
                                <tr>
                                    <th>Fecha Inicio</th>
                                    <th>Fecha Fin</th>
                                    <th>Actividad</th>
                                    <th>Gerencia / Área</th>
                                    <th>Hora</th>
                                    <th>Lugar</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Detalles -->
    <div class="modal fade" id="eventModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header px-4 py-3">
                    <span id="modalGerenciaBadge" class="badge-gerencia me-3"></span>
                    <h5 class="modal-title fw-bold m-0" id="modalTitle">Título</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body px-4 py-4">
                    <div class="row g-4 mb-4">
                        <div class="col-sm-6">
                            <div class="d-flex align-items-start">
                                <i class="fa-regular fa-calendar text-muted mt-1 me-3 fs-5"></i>
                                <div>
                                    <small class="text-muted d-block fw-bold">FECHA</small>
                                    <span id="modalFechas" class="fs-6"></span>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="d-flex align-items-start">
                                <i class="fa-regular fa-clock text-muted mt-1 me-3 fs-5"></i>
                                <div>
                                    <small class="text-muted d-block fw-bold">HORA</small>
                                    <span id="modalHora" class="fs-6"></span>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-12">
                            <div class="d-flex align-items-start">
                                <i class="fa-solid fa-location-dot text-muted mt-1 me-3 fs-5"></i>
                                <div>
                                    <small class="text-muted d-block fw-bold">LUGAR</small>
                                    <span id="modalLugar" class="fs-6"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="bg-light p-3 rounded-3">
                        <small class="text-muted d-block fw-bold mb-2">DESCRIPCIÓN</small>
                        <p id="modalDescripcion" class="mb-0 text-dark" style="white-space: pre-wrap; font-size: 0.95em;"></p>
                    </div>
                </div>
                <div class="modal-footer px-4 py-3">
                    <a id="btnMaps" href="#" target="_blank" class="btn btn-outline-dark btn-custom">
                        <i class="fa-solid fa-map-location-dot me-1"></i> Ver mapa
                    </a>
                    <a id="btnWhatsapp" href="#" target="_blank" class="btn btn-dark btn-custom">
                        <i class="fa-brands fa-whatsapp me-1"></i> Compartir
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Librerías JS -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    
    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>

    <script>
        const GOOGLE_SHEETS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQvUyF5iJVwJgFwXdEllaGqRe8IdhYuY9kiplTYQGqxtNnYvO6-nguq9-1cGxvDPg/pub?gid=2001074359&single=true&output=csv";

        const coloresGerencia = {
            "Cultura": { bg: "#f3e8ff", text: "#7e22ce", border: "#a855f7" },
            "EMAPE": { bg: "#ffedd5", text: "#c2410c", border: "#f97316" },
            "PROHVILLA": { bg: "#ecfccb", text: "#4d7c0f", border: "#84cc16" },
            "PROLIMA": { bg: "#dcfce7", text: "#15803d", border: "#22c55e" },
            "SERPAR": { bg: "#cffafe", text: "#0e7490", border: "#06b6d4" },
            "Gerencia de Desarrollo Humano": { bg: "#e0e7ff", text: "#4338ca", border: "#6366f1" },
            "Comunicaciones y Difusión": { bg: "#fce7f3", text: "#be185d", border: "#ec4899" },
            "MML": { bg: "#f1f5f9", text: "#334155", border: "#64748b" },
            "Default": { bg: "#dbeafe", text: "#1d4ed8", border: "#3b82f6" }
        };

        let tablaActividades; 
        let calendarInstance;

        // Convierte fechas DD/MM/YYYY o YYYY-MM-DD al formato ISO YYYY-MM-DD
        function formatoISO(fechaTexto) {
            if (!fechaTexto) return null;
            const str = fechaTexto.trim();
            if (str.includes('/')) {
                const partes = str.split('/');
                if (partes.length === 3) {
                    const dia = partes[0].padStart(2, '0');
                    const mes = partes[1].padStart(2, '0');
                    const anio = partes[2];
                    return `${anio}-${mes}-${dia}`;
                }
            }
            if (str.includes('-')) {
                const partes = str.split('-');
                if (partes.length === 3) {
                    if (partes[0].length === 4) return str; // YYYY-MM-DD
                    const dia = partes[0].padStart(2, '0');
                    const mes = partes[1].padStart(2, '0');
                    const anio = partes[2];
                    return `${anio}-${mes}-${dia}`;
                }
            }
            return null;
        }

        // Incrementa 1 día en formato ISO para los rangos inclusivos de FullCalendar
        function sumarUnDia(fechaISO) {
            if (!fechaISO) return null;
            const partes = fechaISO.split('-');
            const fecha = new Date(partes[0], partes[1] - 1, partes[2]);
            fecha.setDate(fecha.getDate() + 1);
            
            const yyyy = fecha.getFullYear();
            const mm = String(fecha.getMonth() + 1).padStart(2, '0');
            const dd = String(fecha.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function getColorObj(gerenciaName) {
            const keys = Object.keys(coloresGerencia);
            for (let key of keys) {
                if (gerenciaName.toLowerCase().includes(key.toLowerCase()) && key !== "Default") {
                    return coloresGerencia[key];
                }
            }
            return coloresGerencia["Default"];
        }

        document.addEventListener('DOMContentLoaded', function() {
            Papa.parse(GOOGLE_SHEETS_CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(resultados) { procesarDatos(resultados.data); },
                error: function(err) {
                    console.error(err);
                    alert("Error al cargar datos. Verifica la publicación del CSV.");
                }
            });
        });

        function procesarDatos(filasBrutas) {
            const eventosCalendario = [];
            const filasTabla = [];
            const gerenciasUnicas = new Set();

            filasBrutas.forEach(fila => {
                // Lectura de columnas según tus encabezados exactos
                const titulo = fila['Actividad'] ? fila['Actividad'].trim() : '';
                const fechaInicioTexto = fila['Fecha inicio'] ? fila['Fecha inicio'].trim() : '';
                const fechaFinTexto = fila['Fecha Fin'] ? fila['Fecha Fin'].trim() : '';
                const gerencia = fila['Gerencia'] ? fila['Gerencia'].trim() : 'General';
                const hora = fila['Hora'] ? fila['Hora'].trim() : 'Por definir';
                const lugar = fila['Lugar'] ? fila['Lugar'].trim() : 'Por definir';
                const descripcion = fila['Descripción'] ? fila['Descripción'].trim() : '';

                if (!titulo || !fechaInicioTexto) return;

                gerenciasUnicas.add(gerencia);

                const fechaInicioISO = formatoISO(fechaInicioTexto);
                let fechaFinISO = formatoISO(fechaFinTexto);

                if (fechaInicioISO) {
                    if (fechaFinISO && fechaFinISO !== fechaInicioISO) {
                        fechaFinISO = sumarUnDia(fechaFinISO);
                    } else {
                        fechaFinISO = undefined;
                    }

                    const col = getColorObj(gerencia);
                    const fechaParaMostrar = (fechaFinTexto && fechaFinTexto !== fechaInicioTexto) 
                        ? `${fechaInicioTexto} al ${fechaFinTexto}` 
                        : fechaInicioTexto;

                    eventosCalendario.push({
                        title: titulo,
                        start: fechaInicioISO,
                        end: fechaFinISO,
                        allDay: true,
                        backgroundColor: col.bg,
                        borderColor: col.border,
                        textColor: col.text,
                        extendedProps: {
                            gerencia: gerencia,
                            hora: hora,
                            lugar: lugar,
                            descripcion: descripcion,
                            fechaMostrar: fechaParaMostrar,
                            colorObj: col
                        }
                    });

                    filasTabla.push([
                        fechaInicioTexto,
                        fechaFinTexto,
                        titulo,
                        gerencia,
                        hora,
                        lugar,
                        descripcion,
                        JSON.stringify(col)
                    ]);
                }
            });

            // Llenar selector de gerencias
            const selectGerencia = document.getElementById('filterGerencia');
            Array.from(gerenciasUnicas).sort().forEach(ger => {
                let option = document.createElement('option');
                option.value = ger;
                option.textContent = ger;
                selectGerencia.appendChild(option);
            });

            // Mostrar el contenedor ANTES de inicializar librerías visuales
            document.getElementById('loading').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';

            iniciarCalendario(eventosCalendario);
            iniciarTabla(filasTabla);
            configurarFiltros();

            // Ajustar tamaño del calendario tras hacer visible el DOM
            setTimeout(() => {
                if (calendarInstance) {
                    calendarInstance.updateSize();
                }
            }, 100);
        }

        function iniciarCalendario(eventos) {
            const calendarEl = document.getElementById('calendar');
            calendarInstance = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'es',
                height: 'auto',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,listMonth'
                },
                buttonText: { today: 'Hoy', month: 'Mes', list: 'Lista' },
                events: eventos,
                eventClick: function(info) {
                    abrirDetalles(info.event.title, info.event.extendedProps);
                }
            });
            calendarInstance.render();

            // Sincronizar redimensionamiento al alternar pestañas
            const tabCalendarBtn = document.getElementById('tab-calendar');
            if (tabCalendarBtn) {
                tabCalendarBtn.addEventListener('shown.bs.tab', function () {
                    if (calendarInstance) {
                        calendarInstance.updateSize();
                    }
                });
            }
        }

        function iniciarTabla(datosFilas) {
            tablaActividades = $('#actividadesTable').DataTable({
                data: datosFilas,
                responsive: true,
                language: { url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' },
                order: [[0, "asc"]],
                columnDefs: [
                    { targets: [6, 7], visible: false }, // Ocultar Descripción y JSON de colores
                    { 
                        targets: 3, 
                        render: function (data, type, row) {
                            if (type === 'display') {
                                const col = JSON.parse(row[7]);
                                return `<span class="badge-gerencia" style="background-color:${col.bg}; color:${col.text}; border: 1px solid ${col.border}">${data}</span>`;
                            }
                            return data;
                        }
                    }
                ]
            });

            $('#actividadesTable tbody').on('click', 'tr', function () {
                const dataFila = tablaActividades.row(this).data();
                if (!dataFila) return;
                
                const props = {
                    fechaMostrar: dataFila[1] ? `${dataFila[0]} al ${dataFila[1]}` : dataFila[0],
                    gerencia: dataFila[3],
                    hora: dataFila[4],
                    lugar: dataFila[5],
                    descripcion: dataFila[6],
                    colorObj: JSON.parse(dataFila[7])
                };
                abrirDetalles(dataFila[2], props);
            });
        }

        function configurarFiltros() {
            $.fn.dataTable.ext.search.push(function(settings, data, dataIndex) {
                const filtroGerencia = $('#filterGerencia').val();
                const filtroFecha = $('#filterFecha').val();
                
                const filaGerencia = data[3];
                const filaFechaTexto = data[0];

                if (filtroGerencia && filaGerencia !== filtroGerencia) return false;

                if (filtroFecha) {
                    const filaFechaISO = formatoISO(filaFechaTexto);
                    if (filaFechaISO !== filtroFecha) return false;
                }
                return true;
            });

            $('#filterGerencia, #filterFecha').on('change', function() {
                tablaActividades.draw();
            });

            $('#btnClearFilters').on('click', function() {
                $('#filterGerencia').val('');
                $('#filterFecha').val('');
                tablaActividades.search('').draw();
            });
        }

        function abrirDetalles(titulo, detalles) {
            document.getElementById('modalTitle').textContent = titulo;
            document.getElementById('modalFechas').textContent = detalles.fechaMostrar;
            document.getElementById('modalHora').textContent = detalles.hora;
            document.getElementById('modalLugar').textContent = detalles.lugar;
            document.getElementById('modalDescripcion').textContent = detalles.descripcion || 'Sin información adicional.';
            
            const badge = document.getElementById('modalGerenciaBadge');
            badge.textContent = detalles.gerencia;
            badge.style.backgroundColor = detalles.colorObj.bg;
            badge.style.color = detalles.colorObj.text;
            badge.style.border = `1px solid ${detalles.colorObj.border}`;

            const textoMaps = encodeURIComponent(detalles.lugar + ", Lima");
            document.getElementById('btnMaps').href = `https://www.google.com/maps/search/?api=1&query=${textoMaps}`;

            const mensajeWA = `*${titulo}*\n📅 ${detalles.fechaMostrar}\n⏰ ${detalles.hora}\n📍 ${detalles.lugar}\n🏢 ${detalles.gerencia}`;
            document.getElementById('btnWhatsapp').href = `https://wa.me/?text=${encodeURIComponent(mensajeWA)}`;

            new bootstrap.Modal(document.getElementById('eventModal')).show();
        }
    </script>
</body>
</html>
